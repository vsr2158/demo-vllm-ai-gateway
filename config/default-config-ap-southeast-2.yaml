model_list:
# =============================================================================
# Bedrock models — ap-southeast-2 (Sydney)
#
# This list reflects models VERIFIED active + invokable in account
# 144951176537 on 2026-10-12 (bedrock-runtime converse smoke tests).
# Prefix preference: au.* (Australia-local, lowest latency from Sydney) >
# apac.* (Asia-Pacific) > global.*. Legacy apac.* Claude 3.x profiles were
# removed because Bedrock has revoked access to them ("marked by provider as
# Legacy and you have not been actively using the model in the last 30 days").
#
# NOTE: all modern Claude models on Bedrock are inference-profile-only
# (no direct on-demand foundation-model id), hence the region prefixes.
# =============================================================================

# --- Anthropic Claude (au. regional inference profiles) ----------------------
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: bedrock/au.anthropic.claude-sonnet-4-5-20250929-v1:0

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/au.anthropic.claude-sonnet-4-6

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/au.anthropic.claude-sonnet-5

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: bedrock/au.anthropic.claude-sonnet-5-5

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/au.anthropic.claude-haiku-4-5-20251001-v1:0

  - model_name: claude-haiku-5-5
    litellm_params:
      model: bedrock/au.anthropic.claude-haiku-5-5

  - model_name: claude-opus-4-6
    litellm_params:
      model: bedrock/au.anthropic.claude-opus-4-6-v1

  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/au.anthropic.claude-opus-4-7

  - model_name: claude-opus-4-8
    litellm_params:
      model: bedrock/au.anthropic.claude-opus-4-8

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/au.anthropic.claude-opus-5

  - model_name: claude-opus-5-5
    litellm_params:
      model: bedrock/au.anthropic.claude-opus-5-5

# --- Amazon Nova (apac. regional inference profiles) -------------------------
  - model_name: nova-micro
    litellm_params:
      model: bedrock/apac.amazon.nova-micro-v1:0

  - model_name: nova-lite
    litellm_params:
      model: bedrock/apac.amazon.nova-lite-v1:0

  - model_name: nova-pro
    litellm_params:
      model: bedrock/apac.amazon.nova-pro-v1:0

# --- Embeddings (direct on-demand foundation models) -------------------------
  - model_name: titan-embed-text-v2
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      drop_params: true # avoid errors when encoding_format is passed by the openai client

  - model_name: titan-embed-image-v1
    litellm_params:
      model: bedrock/amazon.titan-embed-image-v1
      drop_params: true

  - model_name: cohere-embed-english-v3
    litellm_params:
      model: bedrock/cohere.embed-english-v3
      drop_params: true

  - model_name: cohere-embed-multilingual-v3
    litellm_params:
      model: bedrock/cohere.embed-multilingual-v3
      drop_params: true
